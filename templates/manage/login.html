{% extends "manage/base.html" %}{% block title %}Admin Login{% endblock %}
{% block content %}<section class="login-shell"><div class="login-copy"><span class="eyebrow">PRIVATE ACCESS</span><h1>Welcome<br>back<span>.</span></h1><p>Sign in to manage every part of your portfolio website.</p></div>
<form method="post" class="login-card">{% csrf_token %}<h2>Admin login</h2><p class="muted">Use your Django staff account.</p>
{% if error %}<div class="notice error">{{ error }}</div>{% endif %}
<label>Username<input name="username" autocomplete="username" required autofocus></label>
<label>Password<input name="password" type="password" autocomplete="current-password" required></label>
<button class="btn solid" type="submit">Sign in <span>→</span></button></form></section>{% endblock %}
